- name: Set up this machine on top of Omarchy
  hosts: localhost
  pre_tasks:
    - name: Load local settings
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: [local.yml]
          paths: ["{{ playbook_dir }}/vars"]
          skip: true
  roles:
    - packages
    - dotfiles
    - tools
    - services
    - nas
    - reminders
