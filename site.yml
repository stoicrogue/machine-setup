- name: Set up this machine on top of Omarchy
  hosts: localhost
  pre_tasks:
    - name: Refuse to run as root
      ansible.builtin.assert:
        that: ansible_facts.user_id != 'root'
        fail_msg: "Run as your own user, without sudo. --ask-become-pass handles the root steps."
    - name: Load local settings
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: [local.yml]
          paths: ["{{ playbook_dir }}/vars"]
          skip: true
  roles:
    - packages
    # Before dotfiles: chezmoi puts files inside ~/ComfyUI, and git can't clone into a non-empty dir.
    - comfyui
    - comfy_studio
    - dotfiles
    - tools
    - services
    - power
    - nas
    - reminders
