- name: Install packages
  community.general.pacman:
    name: "{{ packages }}"
    state: present
  become: true

- name: Find AUR packages that are not installed
  ansible.builtin.command: pacman -Q -- {{ item }}
  loop: "{{ aur_packages }}"
  register: aur_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remember missing AUR packages for the reminders
  ansible.builtin.set_fact:
    aur_missing: "{{ aur_check.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
