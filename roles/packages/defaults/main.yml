# Extras on top of a stock Omarchy install. Edit freely.
packages:
  # Apps
  - brave-bin
  - ghostty
  - handbrake
  - keepassxc
  - zed
  - omazed
  # Media
  - libdvdcss
  - gst-libav
  - gst-plugins-good
  # Dotfiles, sync, dictation
  - chezmoi
  - syncthing
  - voxtype-bin
  # Documents (pandoc + LaTeX for PDF output via xelatex)
  - pandoc-cli
  - texlive-xetex
  - texlive-latexrecommended
  - texlive-latexextra
  - texlive-fontsrecommended
  - texlive-fontsextra
