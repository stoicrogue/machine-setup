  - docker
  - docker-compose
  # Hardware and firmware
  - framework-system
  - fwupd
  - usbutils
  - dmidecode
  - lshw
  - nvme-cli
  - smartmontools
  # NAS
  - nfs-utils
  # Fonts
  - ttf-firacode-nerd
