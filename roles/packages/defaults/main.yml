# Extras on top of a stock Omarchy install. Edit freely.
packages:
  # Apps
  - brave-bin
  - ghostty
  - handbrake
  - keepassxc
  - zed
  - omazed
  - claude-desktop
  - telegram-desktop
  - kdenlive
  - xournalpp
  # Media
  - vlc
  - vlc-plugin-ffmpeg
  - libdvdcss
  - gst-libav
  - gst-plugins-good
  # Dotfiles, sync, dictation
  - chezmoi
  - syncthing
  - voxtype-bin
  # Documents (pandoc + LaTeX for PDF output via xelatex)
  - pandoc-cli
  - texlive-xetex
  - texlive-latexrecommended
  - texlive-latexextra
  - texlive-fontsrecommended
  - texlive-fontsextra
  # Containers
  - docker
  - docker-compose
  - lazydocker
  # C/C++ toolchain
  - clang
  - llvm
  # Hardware and firmware
  - framework-system
  - fwupd
  - usbutils
  - dmidecode
  - lshw
  - nvme-cli
  - smartmontools
  # NAS
  - nfs-utils
  # Fonts
  - ttf-firacode-nerd

# AUR-only packages. The pacman task above can't install these, and yay can't
# run as root, so bootstrap.sh installs them with `omarchy pkg aur add` before
# the playbook runs. The playbook only reports any that are missing.
aur_packages:
  - warp-terminal-bin
