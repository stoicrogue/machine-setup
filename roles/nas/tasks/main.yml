- name: Set up NAS automount
  when: nas_server | length > 0
  block:
    # No mode: once mounted, this path is the share itself.
    - name: Create mount point
      ansible.builtin.file:  # noqa: risky-file-permissions
        path: "{{ nas_mountpoint }}"
        state: directory

    - name: Add NAS share to fstab
      ansible.posix.mount:
        src: "{{ nas_server }}:{{ nas_export }}"
        path: "{{ nas_mountpoint }}"
        fstype: nfs
        opts: "{{ nas_options }}"
        state: present
      become: true
      notify: Start NAS automount
