- name: Manual steps left to do
  ansible.builtin.debug:
    msg:
      - "Restore your SSH key to ~/.ssh, then: chmod 600 ~/.ssh/id_*"
      - "Log in to tools: gh auth login, claude, codex"
      - "Fingerprint: omarchy setup security fingerprint"
      - "Dictation: omarchy install dictation voxtype, then log out and back in"
      - "Steam: omarchy install gaming steam (enables multilib and picks GPU drivers)"
      - "Open KeePassXC and point it at your database"
      - "ComfyUI models: save a Civitai API key to ~/.config/civitai/token (chmod 600), then download checkpoints to ~/ComfyUI/models/checkpoints and LoRAs to ~/ComfyUI/models/loras"

- name: AUR packages still missing
  ansible.builtin.debug:
    msg: "Install with: omarchy pkg aur add {{ aur_missing | join(' ') }}"
  when: aur_missing | default([]) | length > 0
